<section class="hero">
  <div class="container">
    <div class="hero-content">
      <div class="hero-text">
        <h1 class="hero-title animate-fade-in-up">
          {{ "home.name" | translate }}
        </h1>
        <h2 class="hero-subtitle animate-fade-in-up">
          {{ "home.subtitle" | translate }}
        </h2>
        <p class="hero-location animate-fade-in-up">
          {{ "home.location" | translate }}
        </p>
        <p class="hero-description animate-fade-in-up">
          {{ "home.description" | translate }}
        </p>

        <div class="hero-actions animate-fade-in-up">
          <a href="mailto:mahmoudemad7521@gmail.com" class="btn btn-primary">{{
            "home.cta.getInTouch" | translate
          }}</a>
          <a
            href="#projects"
            class="btn btn-outline"
            (click)="$event.preventDefault(); scrollToSection('projects')"
          >
            {{ "home.cta.viewWork" | translate }}
          </a>
        </div>

        <div class="hero-social animate-fade-in-up">
          <div class="social-links">
            <a
              href="https://github.com/devMahmoudEmad"
              class="social-link"
              target="_blank"
              rel="noopener"
            >
              <app-icon name="github" [size]="24"></app-icon>
            </a>
            <a
              href="https://www.linkedin.com/in/mahmoud-emad-373970216/"
              class="social-link"
              target="_blank"
              rel="noopener"
            >
              <app-icon name="linkedin" [size]="24"></app-icon>
            </a>
          </div>
          <div class="contact-info">
            <p class="hero-email ltr-text" dir="ltr">
              mahmoudemad7521@gmail.com
            </p>
            <a
              class="hero-phone ltr-text"
              dir="ltr"
              href="https://wa.me/201012879570"
              target="_blank"
              rel="noopener"
            >
              +20 101 287 9570
            </a>
          </div>
        </div>
      </div>

      <div class="hero-visual">
        <div class="hero-avatar">
          <img
            src="assets/mahmoud%20emad.jpeg"
            alt="{{ 'home.avatarAlt' | translate }}"
            class="avatar-image"
            onerror="
              this.style.display = 'none';
              this.parentElement.classList.add('avatar-error');
            "
          />
        </div>
      </div>
    </div>
  </div>
</section>
