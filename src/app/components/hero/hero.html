<section class="hero">
  <div class="container">
    <div class="hero-content">
      <div class="hero-text">
        <p class="hero-badge">{{ "home.location" | translate }}</p>
        <h1 class="hero-title">{{ "home.name" | translate }}</h1>
        <h2 class="hero-subtitle">{{ "home.subtitle" | translate }}</h2>
        <p class="hero-description">{{ "home.description" | translate }}</p>

        <div class="hero-actions">
          <a href="mailto:mahmoudemad7521@gmail.com" class="btn btn-primary">
            {{ "home.cta.getInTouch" | translate }}
          </a>
          <a
            href="#projects"
            class="btn btn-outline"
            (click)="$event.preventDefault(); scrollToSection('projects')"
          >
            {{ "home.cta.viewWork" | translate }}
          </a>
          <a
            href="assets/Mahmoud%20Emad%20.Net%20Developer%20CV.pdf"
            class="btn btn-accent"
            target="_blank"
            rel="noopener"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            {{ "home.cta.resume" | translate }}
          </a>
        </div>

        <div class="hero-social">
          <a
            href="https://github.com/devMahmoudEmad"
            class="social-btn"
            target="_blank" rel="noopener"
            aria-label="GitHub"
          >
            <app-icon name="github" [size]="20"></app-icon>
          </a>
          <a
            href="https://www.linkedin.com/in/mahmoud-emad-373970216/"
            class="social-btn"
            target="_blank" rel="noopener"
            aria-label="LinkedIn"
          >
            <app-icon name="linkedin" [size]="20"></app-icon>
          </a>
        </div>
      </div>

      <div class="hero-visual">
        <div class="hero-avatar">
          <img
            src="assets/mahmoud%20emad.jpeg"
            alt="{{ 'home.avatarAlt' | translate }}"
            class="avatar-image"
            loading="eager"
            onerror="
              this.style.display = 'none';
              this.parentElement.classList.add('avatar-error');
            "
          />
        </div>
      </div>
    </div>
  </div>
</section>
