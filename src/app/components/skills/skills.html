<section class="skills section">
  <div class="container">
    <h2 class="section-title">{{ "skills.title" | translate }}</h2>
    <div class="skills-content">
      <div *ngFor="let category of categories" class="skill-category" [class.learning-category]="category.key === 'learning'">
        <h3 class="category-title">
          <span class="category-icon material-symbols-outlined">{{ category.icon }}</span>
          {{ category.titleKey | translate }}
        </h3>
        <div class="skills-grid">
          <div *ngFor="let item of getCategoryItems(category)" class="tech-badge">
            {{ item }}
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
